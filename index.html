    <script>
        // 1. Initialize your precise database cluster URL node location
        const firebaseConfig = {
            databaseURL: "https://tyalgoapp-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);

        // 2. Open active websocket listener stream pipeline channels
        firebase.database().ref('trading_system/live_matrix').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                // UI Mapping parameter elements bindings
                if (data.system_gate) {
                    document.getElementById('verdict').innerText = data.system_gate.verdict || "N/A";
                    document.getElementById('delta-val').innerText = data.system_gate.calculated_delta_pct || "0%";
                }
                
                document.getElementById('timestamp').innerText = "UPDATED: " + (data.timestamp || "") + " IST";
                
                if (data.market_snapshot) {
                    document.getElementById('nifty-spot').innerText = "₹" + (data.market_snapshot.nifty_spot ? data.market_snapshot.nifty_spot.toLocaleString('en-IN') : "0.00");
                    document.getElementById('india-vix').innerText = data.market_snapshot.india_vix ? data.market_snapshot.india_vix.toFixed(2) : "0.00";
                }
                
                if (data.active_strategy) {
                    document.getElementById('regime').innerText = data.active_strategy.regime || "-";
                    document.getElementById('action').innerText = data.active_strategy.target_action || "-";
                    document.getElementById('sell-legs').innerText = data.active_strategy.sell_legs || "-";
                    document.getElementById('buy-legs').innerText = data.active_strategy.buy_legs || "-";
                    document.getElementById('exit-window').innerText = data.active_strategy.exit_window || "-";
                }
            }
        }, (error) => {
            console.error("Firebase Read Error: ", error);
            document.getElementById('verdict').innerText = "AUTH / RULE ERROR ❌";
        });
    </script>
</body>
</html>
